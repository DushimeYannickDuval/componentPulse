version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: cpulse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ./.env.postgres
    environment:
      # Fallbacks if .env.postgres is missing
      POSTGRES_USER: ${POSTGRES_USER:-cpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpulse}
      POSTGRES_DB: ${POSTGRES_DB:-cpulse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpulse} -d ${POSTGRES_DB:-cpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
